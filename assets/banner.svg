<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#080c14"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".35"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></linearGradient><linearGradient id="glowGrad2" x1="100%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".3"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="cardShadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="40"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb1{0%{transform:translate(0,0) scale(1);opacity:.35}50%{transform:translate(60px,30px) scale(1.15);opacity:.6}}@keyframes pulseOrb2{0%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(-40px,-20px) scale(1.1);opacity:.55}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}.orb-1{animation:pulseOrb1 8s ease-in-out infinite}.orb-2{animation:pulseOrb2 9s ease-in-out infinite}.pill-1{animation:floatPill1 5s ease-in-out infinite}.pill-2{animation:floatPill2 6s ease-in-out infinite}.flow-line{stroke-dasharray:6 6;animation:dashMove 2s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#grid)"/><circle cx="220" cy="90" r="160" fill="url(#glowGrad1)" class="orb-1" filter="url(#glow)"/><circle cx="980" cy="270" r="180" fill="url(#glowGrad2)" class="orb-2" filter="url(#glow)"/><path fill="none" stroke="rgba(99, 102, 241, 0.22)" stroke-width="2" d="M 50 180 Q 280 60 600 180 T 1150 180" class="flow-line"/><path fill="none" stroke="rgba(192, 132, 252, 0.18)" stroke-width="1.5" d="M 80 260 Q 400 320 700 220 T 1120 120" class="flow-line"/><g class="pill-1" transform="translate(140, 50)"><rect width="130" height="34" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" filter="url(#cardShadow)" rx="17"/><text x="65" y="21" fill="#7dd3fc" font-size="12" font-weight="600" letter-spacing=".5" text-anchor="middle">⚡ React Native</text></g><g class="pill-2" transform="translate(930, 60)"><rect width="110" height="34" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" filter="url(#cardShadow)" rx="17"/><text x="55" y="21" fill="#a5b4fc" font-size="12" font-weight="600" letter-spacing=".5" text-anchor="middle">💙 Flutter</text></g><g class="pill-2" transform="translate(100, 280)"><rect width="115" height="34" fill="url(#cardGrad)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1" filter="url(#cardShadow)" rx="17"/><text x="57" y="21" fill="#f472b6" font-size="12" font-weight="600" letter-spacing=".5" text-anchor="middle">🦀 Tauri &amp; Rust</text></g><g class="pill-1" transform="translate(950, 275)"><rect width="130" height="34" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" filter="url(#cardShadow)" rx="17"/><text x="65" y="21" fill="#d8b4fe" font-size="12" font-weight="600" letter-spacing=".5" text-anchor="middle">🚀 Kotlin (KMP)</text></g><g transform="translate(220, 80)"><rect width="760" height="200" fill="#0d1424" fill-opacity=".82" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" filter="url(#cardShadow)" rx="18"/><g transform="translate(255, 22)"><rect width="250" height="26" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" rx="13"/><text x="125" y="17" fill="#818cf8" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">CURATED ECOSYSTEM DIRECTORY</text></g><text x="380" y="85" fill="url(#primaryGrad)" font-size="34" font-weight="800" letter-spacing="-.5" text-anchor="middle">Cross-Platform Native Apps</text><text x="380" y="118" fill="#cbd5e1" font-size="15" font-weight="500" letter-spacing=".2" text-anchor="middle">Universal Frameworks • Cloud Build CI/CD • Native Runtimes • OTA Pipelines</text><g transform="translate(130, 145)"><rect width="85" height="26" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" rx="6"/><text x="42" y="17" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">📱 iOS</text><rect width="95" height="26" x="100" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" rx="6"/><text x="147" y="17" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">🤖 Android</text><rect width="90" height="26" x="210" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" rx="6"/><text x="255" y="17" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">🖥️ macOS</text><rect width="95" height="26" x="315" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" rx="6"/><text x="362" y="17" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">🪟 Windows</text><rect width="85" height="26" x="425" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" rx="6"/><text x="467" y="17" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">🐧 Linux</text></g></g></svg>